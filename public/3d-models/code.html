<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width,initial-scale=1.0" name="viewport">
  <title>Aura Celestial - Master 3D Solar Alignment Engine (Final Edition)</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020408;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="relative w-full h-full bg-[#020408] text-slate-100 select-none overflow-hidden">

  <!-- Fullscreen 3D Three.js Solar System Engine Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>

  <!-- HUD Telemetry Top Bar -->
  <header class="absolute top-0 inset-x-0 z-20 pointer-events-none p-6 flex justify-between items-start">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#070b14]/80 backdrop-blur-md border border-[#2dd4bf]/25 text-[11px] shadow-[0_0_20px_rgba(45,212,191,0.15)]">
        <span class="w-2 h-2 rounded-full bg-[#2dd4bf] animate-pulse"></span>
        <span class="text-slate-400">EPHEMERIS:</span>
        <span class="text-[#f5b942] font-semibold tracking-wider">J2000.0 SIDEREAL</span>
        <span class="text-slate-600">|</span>
        <span class="text-slate-400">TRANSLATION:</span>
        <span class="text-[#2dd4bf] font-semibold">LINEAR ECLIPTIC</span>
      </div>
      <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#070b14]/80 backdrop-blur-md border border-slate-800 text-[11px]">
        <span class="text-slate-400">SCALE:</span>
        <span class="text-slate-200">1 AU ≈ 149.6M KM (CALIBRATED)</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#070b14]/80 backdrop-blur-md border border-slate-800 text-[11px]">
        <span class="text-slate-400">SYSTEM:</span>
        <span class="text-emerald-400 font-semibold">9 BODIES ALIGNED</span>
      </div>
      <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#f5b942]/10 border border-[#f5b942]/40 text-[#f5b942] text-[11px] font-semibold tracking-widest uppercase shadow-[0_0_15px_rgba(245,185,66,0.15)]">
        MASTER ENGINE v3.0
      </div>
    </div>
  </header>

  <!-- Bottom Interactive HUD Footer -->
  <footer class="absolute bottom-0 inset-x-0 z-20 pointer-events-none p-6 flex flex-col sm:flex-row justify-between items-end sm:items-center gap-4">
    <div class="flex items-center gap-3 text-xs tracking-wider">
      <span class="w-2.5 h-2.5 rounded-full bg-[#f5b942] shadow-[0_0_10px_#f5b942]"></span>
      <span class="text-[#f5b942] font-bold uppercase tracking-widest text-sm">AURA CELESTIAL</span>
      <span class="text-slate-500">•</span>
      <span class="text-slate-400">Ultra-Fidelity Procedural Shaders & Gravitational Manifolds</span>
    </div>
    <div class="flex items-center gap-2 text-[11px] text-slate-400 bg-[#070b14]/80 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-slate-800">
      <span class="text-[#2dd4bf]">✦</span> Drag / Move Mouse for Parallax Perspective • Hover Celestial Bodies
    </div>
  </footer>

  <!-- Three.js CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>

  <script>
  (function() {
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    // 1. Scene, Camera & ACES Filmic Tone-Mapped Renderer
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020408, 0.00035);

    const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 4500);
    camera.position.set(16, 22, 385);
    camera.lookAt(16, -2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    // 2. Comprehensive Celestial Lighting
    const ambientLight = new THREE.AmbientLight(0x0d1424, 1.85);
    scene.add(ambientLight);

    // Radiant Sun Photosphere Point Light (radiating from x = -195)
    const sunLight = new THREE.PointLight(0xfff6dd, 7.2, 3200, 0.55);
    sunLight.position.set(-195, 0, 0);
    scene.add(sunLight);

    // Directional light from Sun pointing along the alignment axis
    const sunDirectional = new THREE.DirectionalLight(0xffeed0, 2.4);
    sunDirectional.position.set(-195, 0, 20);
    sunDirectional.target.position.set(50, 0, 0);
    scene.add(sunDirectional);
    scene.add(sunDirectional.target);

    // Deep cosmic rim & teal starlight backfills
    const tealRim = new THREE.DirectionalLight(0x2dd4bf, 0.65);
    tealRim.position.set(80, 90, -120);
    scene.add(tealRim);

    const deepIndigoFill = new THREE.DirectionalLight(0x6366f1, 0.4);
    deepIndigoFill.position.set(140, -80, 90);
    scene.add(deepIndigoFill);

    // 3. Multi-Layer Realistic Deep Starfield & Cosmic Dust
    const starCount = 3800;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    const starCols = new Float32Array(starCount * 3);
    const palette = [
      new THREE.Color(0xffffff),
      new THREE.Color(0xfff4cc),
      new THREE.Color(0x93c5fd),
      new THREE.Color(0x2dd4bf),
      new THREE.Color(0xf5b942),
      new THREE.Color(0xc084fc)
    ];

    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 3200;
      starPos[i+1] = (Math.random() - 0.5) * 1900;
      starPos[i+2] = (Math.random() - 0.5) * 2600 - 180;
      const col = palette[Math.floor(Math.random() * palette.length)];
      starCols[i] = col.r; starCols[i+1] = col.g; starCols[i+2] = col.b;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starCols, 3));
    const starMat = new THREE.PointsMaterial({ size: 1.45, vertexColors: true, transparent: true, opacity: 0.88 });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // Main Linear Planetary Group
    const linearGroup = new THREE.Group();
    scene.add(linearGroup);

    // 4. Procedural High-Fidelity Canvas Textures (Detailed 2048x1024 & 1024x512)
    function createSunTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(512, 512, 80, 512, 512, 512);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.12, '#fff6d2');
      g.addColorStop(0.35, '#f5b942');
      g.addColorStop(0.65, '#e05307');
      g.addColorStop(0.86, '#941717');
      g.addColorStop(1, '#240404');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);

      // Micro plasma granulations & magnetic convective cells
      for (let i = 0; i < 1500; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const dist = Math.hypot(x - 512, y - 512);
        if (dist < 500) {
          ctx.fillStyle = `rgba(255, 245, 210, ${Math.random() * 0.22})`;
          ctx.beginPath();
          ctx.arc(x, y, Math.random() * 18 + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      return new THREE.CanvasTexture(c);
    }

    function createMercuryTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#686b73'; ctx.fillRect(0, 0, 1024, 512);
      // Ancient cratered maria plains & impact rays
      for (let i = 0; i < 350; i++) {
        const cx = Math.random() * 1024, cy = Math.random() * 512, cr = Math.random() * 22 + 4;
        ctx.fillStyle = Math.random() > 0.4 ? 'rgba(45, 48, 54, 0.45)' : 'rgba(160, 164, 175, 0.35)';
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(215, 220, 230, 0.15)'; ctx.lineWidth = 1;
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    function createVenusTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d4a877'; ctx.fillRect(0, 0, 1024, 512);
      // Dense swirling sulfuric acid cloud bands & atmospheric shearing
      for (let y = 0; y < 512; y += 4) {
        ctx.fillStyle = Math.sin(y * 0.08) > 0 ? 'rgba(247, 228, 198, 0.35)' : 'rgba(184, 131, 80, 0.35)';
        ctx.fillRect(0, y, 1024, 3);
      }
      for (let i = 0; i < 90; i++) {
        ctx.fillStyle = 'rgba(255, 242, 218, 0.2)';
        ctx.beginPath();
        ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*140+30, Math.random()*16+4, 0.35, 0, Math.PI*2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function createEarthTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      // Abyssal deep blues
      ctx.fillStyle = '#0a2744'; ctx.fillRect(0, 0, 1024, 512);

      // Continental shelf gradients
      ctx.fillStyle = '#114a6b';
      for (let i = 0; i < 40; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*1024, Math.random()*380+60, Math.random()*120+35, Math.random()*65+20, Math.random(), 0, Math.PI*2);
        ctx.fill();
      }

      // Landmasses (verdant greens and desert ochres)
      ctx.fillStyle = '#1d5a37';
      for (let i = 0; i < 48; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*1024, Math.random()*360+70, Math.random()*95+25, Math.random()*50+15, Math.random()*0.8, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.fillStyle = '#8b6938';
      for (let i = 0; i < 24; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*1024, Math.random()*280+110, Math.random()*45+15, Math.random()*25+8, Math.random()*0.5, 0, Math.PI*2);
        ctx.fill();
      }

      // Polar ice caps
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath(); ctx.ellipse(512, 18, 512, 24, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(512, 494, 512, 24, 0, 0, Math.PI*2); ctx.fill();

      // Atmospheric cloud decks and vortex curls
      ctx.fillStyle = 'rgba(255, 255, 255, 0.48)';
      for (let i = 0; i < 85; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*150+30, Math.random()*16+3, Math.random()*0.4-0.2, 0, Math.PI*2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function createMarsTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      // Iron oxide rust desert
      ctx.fillStyle = '#b74324'; ctx.fillRect(0, 0, 1024, 512);

      // Dark volcanic basalt patches (Syrtis Major & Acidalia Planitia)
      ctx.fillStyle = '#612111';
      for (let i = 0; i < 45; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*75+20, Math.random()*35+10, Math.random(), 0, Math.PI*2);
        ctx.fill();
      }
      // Bright polar ice cap
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(512, 14, 28, 0, Math.PI*2); ctx.fill();
      return new THREE.CanvasTexture(c);
    }

    // Jupiter: Distinct, high-contrast dynamic gas giant with detailed belts and festoon eddies (NO isolated orange patch)
    function createJupiterMasterTex() {
      const c = document.createElement('canvas'); c.width = 2048; c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b0774a'; ctx.fillRect(0, 0, 2048, 1024);

      // Distinct latitudinal belts & zones (North/South Equatorial & Temperate Belts)
      const bands = [
        '#f0e5d8', '#804c26', '#c9a17b', '#4e280d', '#f6ece1',
        '#8c5831', '#d4af88', '#5b3216', '#eedfd0', '#9c663f',
        '#663717', '#e7d6c3', '#794723', '#ba9370', '#4a250b'
      ];
      const bandHeight = 1024 / bands.length;
      for (let i = 0; i < bands.length; i++) {
        ctx.fillStyle = bands[i];
        ctx.fillRect(0, i * bandHeight, 2048, bandHeight);
      }

      // Sinusoidal boundary shearing and fluid turbulence between belts
      for (let y = 0; y < 1024; y += 6) {
        const offset = Math.sin(y * 0.04) * 24 + Math.cos(y * 0.015) * 16;
        ctx.fillStyle = (y % 12 === 0) ? 'rgba(255, 250, 240, 0.18)' : 'rgba(40, 18, 6, 0.14)';
        ctx.beginPath();
        ctx.ellipse((y * 3 + offset) % 2048, y, 140, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Fine festoons & white oval storm plumes (cyclonic storms natural to Jupiter)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
      for (let i = 0; i < 65; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random() * 2048, Math.random() * 600 + 200, Math.random() * 32 + 8, Math.random() * 12 + 4, Math.random() * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    // Saturn: Distinct from Jupiter - Soft, tranquil butterscotch & champagne mist with smooth latitudinal gradations
    function createSaturnMasterTex() {
      const c = document.createElement('canvas'); c.width = 2048; c.height = 1024;
      const ctx = c.getContext('2d');
      // Uniform butterscotch champagne base
      ctx.fillStyle = '#e8d4a9'; ctx.fillRect(0, 0, 2048, 1024);

      // Delicate, soft harmonic gradient bands (subtle, tranquil, no harsh Jovian contrasts)
      for (let y = 0; y < 1024; y += 4) {
        const factor = Math.sin((y / 1024) * Math.PI * 14);
        ctx.fillStyle = factor > 0.05 ? '#d9be8c' : '#faedd0';
        ctx.fillRect(0, y, 2048, 3.5);
      }

      // Polar hexagon & golden polar darkening
      const pGrad = ctx.createLinearGradient(0, 0, 0, 1024);
      pGrad.addColorStop(0, 'rgba(148, 122, 75, 0.45)');
      pGrad.addColorStop(0.18, 'rgba(0, 0, 0, 0)');
      pGrad.addColorStop(0.5, 'rgba(255, 245, 220, 0.15)'); // Equatorial brightening
      pGrad.addColorStop(0.82, 'rgba(0, 0, 0, 0)');
      pGrad.addColorStop(1, 'rgba(148, 122, 75, 0.45)');
      ctx.fillStyle = pGrad;
      ctx.fillRect(0, 0, 2048, 1024);

      return new THREE.CanvasTexture(c);
    }

    // Saturn Ring System: Continuous, seamless 360° annular manifold with authentic A, B, C rings & Cassini division
    function createSaturnContinuousRingTex() {
      const c = document.createElement('canvas'); c.width = 2048; c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 2048, 0);

      // Inner boundary (transparent)
      g.addColorStop(0, 'rgba(215, 185, 130, 0)');
      // Ring C (Crepe ring) - faint translucent
      g.addColorStop(0.08, 'rgba(200, 175, 130, 0.28)');
      g.addColorStop(0.20, 'rgba(220, 195, 150, 0.55)');
      // Ring B (Brightest, densest main ring)
      g.addColorStop(0.25, 'rgba(245, 225, 180, 0.96)');
      g.addColorStop(0.52, 'rgba(235, 210, 165, 0.92)');
      // Cassini Division (delicate astronomical gap, NOT a physical geometrical cut)
      g.addColorStop(0.55, 'rgba(25, 20, 15, 0.18)');
      g.addColorStop(0.58, 'rgba(35, 28, 20, 0.22)');
      // Ring A (Outer ring with fine Encke division)
      g.addColorStop(0.61, 'rgba(238, 218, 170, 0.88)');
      g.addColorStop(0.78, 'rgba(225, 200, 155, 0.75)');
      g.addColorStop(0.88, 'rgba(195, 168, 125, 0.55)');
      // Outer falloff
      g.addColorStop(0.96, 'rgba(140, 115, 80, 0.25)');
      g.addColorStop(1, 'rgba(100, 80, 50, 0)');

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 2048, 128);

      // Micro-grooved icy particulate density lines across the entire ring circumference
      for (let x = 160; x < 1920; x += 6) {
        ctx.fillStyle = (x % 18 === 0) ? 'rgba(0, 0, 0, 0.09)' : 'rgba(255, 255, 255, 0.07)';
        ctx.fillRect(x, 0, 1.5, 128);
      }
      return new THREE.CanvasTexture(c);
    }

    function createUranusTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#67e8f9'; ctx.fillRect(0, 0, 1024, 512);
      for (let y = 0; y < 512; y += 4) {
        ctx.fillStyle = Math.sin(y * 0.05) > 0 ? 'rgba(165, 243, 252, 0.3)' : 'rgba(34, 211, 238, 0.2)';
        ctx.fillRect(0, y, 1024, 3);
      }
      return new THREE.CanvasTexture(c);
    }

    function createNeptuneTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#2563eb'; ctx.fillRect(0, 0, 1024, 512);
      // Dynamic white methane cirrus cloud streaks & Great Dark Spot
      for (let y = 0; y < 512; y += 8) {
        ctx.fillStyle = 'rgba(59, 130, 246, 0.35)';
        ctx.fillRect(0, y, 1024, 4);
      }
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      for (let i = 0; i < 40; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*90+20, Math.random()*8+2, 0.15, 0, Math.PI*2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function createPlutoTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, 0, 512, 256);
      // Dark reddish-brown tholin terrain
      ctx.fillStyle = '#78350f';
      for (let i = 0; i < 20; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*512, Math.random()*256, Math.random()*50+15, Math.random()*30+8, Math.random(), 0, Math.PI*2);
        ctx.fill();
      }
      // Bright nitrogen ice heart (Tombaugh Regio)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(256, 130, 58, 42, 0.2, 0, Math.PI*2); ctx.fill();
      return new THREE.CanvasTexture(c);
    }

    // 5. Build Celestial Bodies
    // A. Massive Radiant Sun Photosphere (Left bleed at x = -200)
    const sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(66, 64, 64),
      new THREE.MeshBasicMaterial({ map: createSunTex() })
    );
    sunMesh.position.set(-200, 0, 0);
    linearGroup.add(sunMesh);

    // Multi-layered Coronal Glow Halo
    const cCanvas = document.createElement('canvas'); cCanvas.width = 512; cCanvas.height = 512;
    const cCtx = cCanvas.getContext('2d');
    const cGrad = cCtx.createRadialGradient(256, 256, 30, 256, 256, 256);
    cGrad.addColorStop(0, 'rgba(255, 255, 240, 0.98)');
    cGrad.addColorStop(0.24, 'rgba(245, 185, 66, 0.85)');
    cGrad.addColorStop(0.55, 'rgba(224, 83, 7, 0.38)');
    cGrad.addColorStop(0.85, 'rgba(45, 212, 191, 0.14)');
    cGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    cCtx.fillStyle = cGrad; cCtx.fillRect(0, 0, 512, 512);

    const coronaSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(cCanvas), transparent: true, opacity: 0.96, blending: THREE.AdditiveBlending
    }));
    coronaSprite.scale.set(330, 330, 1);
    coronaSprite.position.set(-200, 0, 0);
    linearGroup.add(coronaSprite);

    // B. Planets Linear Alignment Definition
    const planetsDef = [
      { name: 'MERCURY', vedic: 'BUDH', x: -116, r: 3.2, tex: createMercuryTex(), spin: 0.0018 },
      { name: 'VENUS', vedic: 'SHUKRA', x: -92, r: 5.6, tex: createVenusTex(), spin: -0.0014 },
      { name: 'EARTH', vedic: 'PRITHVI', x: -62, r: 6.2, tex: createEarthTex(), spin: 0.0035, isEarth: true },
      { name: 'MARS', vedic: 'MANGAL', x: -30, r: 4.4, tex: createMarsTex(), spin: 0.0032 },
      { name: 'JUPITER', vedic: 'GURU', x: 26, r: 18.0, tex: createJupiterMasterTex(), spin: 0.0048, isJupiter: true },
      { name: 'SATURN', vedic: 'SHANI', x: 86, r: 15.0, tex: createSaturnMasterTex(), spin: 0.0042, isSaturn: true },
      { name: 'URANUS', vedic: 'ARUNA', x: 138, r: 8.2, tex: createUranusTex(), spin: -0.0028 },
      { name: 'NEPTUNE', vedic: 'VARUNA', x: 172, r: 8.0, tex: createNeptuneTex(), spin: 0.0026 },
      { name: 'PLUTO', vedic: 'YAMA', x: 202, r: 2.2, tex: createPlutoTex(), spin: 0.0012 }
    ];

    const planetMeshes = [];

    planetsDef.forEach(p => {
      const mat = new THREE.MeshStandardMaterial({
        map: p.tex,
        roughness: p.isEarth ? 0.42 : (p.isJupiter || p.isSaturn ? 0.52 : 0.65),
        metalness: p.isEarth ? 0.15 : 0.1
      });

      const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 48, 48), mat);
      mesh.position.set(p.x, 0, 0);

      // Continuous Saturn Ring Architecture
      if (p.isSaturn) {
        // High-facet 128 segments to guarantee absolute circular smoothness
        const ringGeo = new THREE.RingGeometry(p.r * 1.35, p.r * 2.75, 128);
        
        // Ensure continuous UV mapping
        const pos = ringGeo.attributes.position;
        const uvs = ringGeo.attributes.uv;
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const currentRadius = Math.hypot(vx, vy);
          // Normalized radial coordinate across the ring width
          const u = (currentRadius - (p.r * 1.35)) / ((p.r * 2.75) - (p.r * 1.35));
          uvs.setXY(i, u, 0.5);
        }
        ringGeo.attributes.uv.needsUpdate = true;

        const ringMat = new THREE.MeshBasicMaterial({
          map: createSaturnContinuousRingTex(),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.95,
          depthWrite: false
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2.3;
        ringMesh.rotation.y = 0.22;
        mesh.add(ringMesh);
      }

      // Chandra (The Moon) orbiting Earth
      if (p.isEarth) {
        const moonGeo = new THREE.SphereGeometry(1.4, 20, 20);
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.position.set(p.r * 2.2, 1.2, 0);
        mesh.add(moonMesh);
        p.moon = moonMesh;

        // Faint lunar orbit track
        const moonPts = [];
        for (let i = 0; i <= 48; i++) {
          const th = (i / 48) * Math.PI * 2;
          moonPts.push(new THREE.Vector3(Math.cos(th) * p.r * 2.2, 0, Math.sin(th) * p.r * 2.2));
        }
        const moonOrbit = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(moonPts),
          new THREE.LineBasicMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.35 })
        );
        mesh.add(moonOrbit);
      }

      // Elegant Technical & Sanskrit Ephemeris Label beneath body
      const lblCanvas = document.createElement('canvas');
      lblCanvas.width = 240; lblCanvas.height = 70;
      const lctx = lblCanvas.getContext('2d');
      lctx.font = 'bold 20px monospace';
      lctx.fillStyle = '#cbd5e1';
      lctx.textAlign = 'center';
      lctx.fillText(p.name, 120, 32);
      lctx.font = '600 13px -apple-system, sans-serif';
      lctx.fillStyle = '#f5b942';
      lctx.fillText(p.vedic, 120, 56);

      const lblSpr = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(lblCanvas), transparent: true, opacity: 0.88
      }));
      lblSpr.scale.set(16, 4.8, 1);
      lblSpr.position.set(0, -p.r - 5.5, 0);
      mesh.add(lblSpr);

      linearGroup.add(mesh);
      planetMeshes.push({ mesh, spin: p.spin, isEarth: p.isEarth, moon: p.moon, r: p.r });
    });

    // 6. Intricate Ephemeris Telemetry Manifolds & Trajectory Curves
    const trajectoryLinesGroup = new THREE.Group();
    linearGroup.add(trajectoryLinesGroup);

    // Linear center axis line
    const axisPts = [new THREE.Vector3(-140, 0, 0), new THREE.Vector3(225, 0, 0)];
    const axisGeo = new THREE.BufferGeometry().setFromPoints(axisPts);
    const axisMat = new THREE.LineBasicMaterial({ color: 0xf5b942, transparent: true, opacity: 0.28 });
    trajectoryLinesGroup.add(new THREE.Line(axisGeo, axisMat));

    // Concentric and interwoven elliptical trajectory manifolds
    function createTrajectoryLoop(cx, cy, rx, ry, tiltZ, opacity, colorHex) {
      const pts = [];
      const segs = 200;
      for (let i = 0; i <= segs; i++) {
        const t = (i / segs) * Math.PI * 2;
        const x = cx + Math.cos(t) * rx;
        const y = cy + Math.sin(t) * ry;
        const z = Math.sin(t * 2) * (rx * 0.08);
        pts.push(new THREE.Vector3(x, y, z));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({
        color: colorHex || 0xf5b942, transparent: true, opacity: opacity || 0.22, linewidth: 1
      });
      const line = new THREE.Line(geo, mat);
      line.rotation.z = tiltZ || 0;
      return line;
    }

    // Intersecting gravitational slingshot & ephemeris manifolds
    trajectoryLinesGroup.add(createTrajectoryLoop(-62, 0, 24, 24, 0, 0.35, 0x2dd4bf)); // Earth orbit ring
    trajectoryLinesGroup.add(createTrajectoryLoop(-62, 0, 42, 38, 0.15, 0.22, 0xf5b942));
    trajectoryLinesGroup.add(createTrajectoryLoop(26, 0, 36, 36, 0, 0.38, 0xf5b942));   // Jupiter sphere ring
    trajectoryLinesGroup.add(createTrajectoryLoop(26, 0, 68, 88, 0.2, 0.25, 0x2dd4bf));
    trajectoryLinesGroup.add(createTrajectoryLoop(26, 0, 88, 58, -0.28, 0.2, 0xf5b942));
    trajectoryLinesGroup.add(createTrajectoryLoop(86, 0, 60, 96, 0.08, 0.28, 0x93c5fd));  // Saturn orbit arc
    trajectoryLinesGroup.add(createTrajectoryLoop(86, 0, 88, 64, -0.15, 0.2, 0xf5b942));

    // Sweeping parabolic trajectory arcs from the Sun
    function createSweepArc(startY, midY, endX, opacity, colorHex) {
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(-145, startY, 0),
        new THREE.Vector3(-40, midY, 15),
        new THREE.Vector3(60, midY * 0.5, -10),
        new THREE.Vector3(endX, 0, 0)
      );
      const pts = curve.getPoints(140);
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: opacity });
      return new THREE.Line(geo, mat);
    }

    trajectoryLinesGroup.add(createSweepArc(35, 28, 26, 0.35, 0xf5b942));
    trajectoryLinesGroup.add(createSweepArc(-35, -28, 86, 0.3, 0x2dd4bf));
    trajectoryLinesGroup.add(createSweepArc(55, 42, 138, 0.25, 0xf5b942));
    trajectoryLinesGroup.add(createSweepArc(-55, -45, 172, 0.22, 0x93c5fd));

    // Precision vertical telemetry rulers
    function createVerticalTelemetryRuler(x, height) {
      const grp = new THREE.Group();
      for (let y = -height; y <= height; y += 5) {
        const isCenter = Math.abs(y) < 1;
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(isCenter ? 0.9 : 0.55, 8, 8),
          new THREE.MeshBasicMaterial({ color: isCenter ? 0xf5b942 : 0x2dd4bf, transparent: true, opacity: isCenter ? 0.9 : 0.5 })
        );
        dot.position.set(x, y, 0);
        grp.add(dot);
      }
      return grp;
    }
    trajectoryLinesGroup.add(createVerticalTelemetryRuler(26, 56));
    trajectoryLinesGroup.add(createVerticalTelemetryRuler(86, 68));

    // 7. Interactive Spring Parallax & Smooth Responsiveness
    let targetMouseX = 0, targetMouseY = 0, curMouseX = 0, curMouseY = 0;
    window.addEventListener('mousemove', e => {
      targetMouseX = ((e.clientX / window.innerWidth) * 2 - 1) * 22;
      targetMouseY = (-(e.clientY / window.innerHeight) * 2 + 1) * 14;
    }, { passive: true });

    function onResize() {
      const nw = window.innerWidth;
      const nh = window.innerHeight;
      camera.aspect = nw / nh;
      camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
    }
    window.addEventListener('resize', onResize);

    // 8. Animation Render Loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Damped spring mouse follow
      curMouseX += (targetMouseX - curMouseX) * 0.045;
      curMouseY += (targetMouseY - curMouseY) * 0.045;

      camera.position.x = 16 + curMouseX * 1.15;
      camera.position.y = 22 + curMouseY * 0.85;
      camera.lookAt(16, -2, 0);

      // Slow, tranquil axial spins for all planetary bodies
      planetMeshes.forEach(p => {
        p.mesh.rotation.y += p.spin;
        if (p.isEarth && p.moon) {
          const mAng = elapsed * 1.8;
          p.moon.position.set(Math.cos(mAng) * (p.r * 2.2), 0.8, Math.sin(mAng) * (p.r * 2.2));
        }
      });

      // Ambient solar corona swirl and starfield precession
      coronaSprite.rotation.z = elapsed * 0.015;
      starField.rotation.y = elapsed * 0.00012;

      renderer.render(scene, camera);
    }
    animate();

  })();
  </script>
</body>
